services:
  libsql:
    image: ghcr.io/tursodatabase/libsql-server:latest
    environment:
      SQLD_NODE: primary
      SQLD_HTTP_LISTEN_ADDR: "0.0.0.0:8080"
    volumes:
      - libsql-data:/var/lib/sqld
    ports:
      - "8081:8080"
    restart: unless-stopped

  api:
    image: ${REGISTRY:-docker.io}/${DOCKER_USERNAME:-local}/quiz-words-api:${IMAGE_TAG:-latest}
    build:
      context: ./server
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      LIBSQL_URL: http://libsql:8080
    expose:
      - "3000"
    depends_on:
      - libsql
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 5s
    restart: unless-stopped

  web:
    image: ${REGISTRY:-docker.io}/${DOCKER_USERNAME:-local}/quiz-words-web:${IMAGE_TAG:-latest}
    build:
      context: ./web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  libsql-data:
