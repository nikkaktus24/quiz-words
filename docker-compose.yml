services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped

  api:
    image: ${REGISTRY:-docker.io}/${DOCKER_USERNAME:-local}/quiz-words-api:${IMAGE_TAG:-latest}
    build:
      context: ./server
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      WEB_ORIGIN: ${WEB_ORIGIN:-*}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: quiz
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 20s
    restart: unless-stopped

  web:
    image: ${REGISTRY:-docker.io}/${DOCKER_USERNAME:-local}/quiz-words-web:${IMAGE_TAG:-latest}
    build:
      context: ./web
    ports:
      - "8080:80"
    environment:
      API_URL: ${API_URL:-}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mongo-data:
