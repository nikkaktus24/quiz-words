name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install
        run: |
          bun install --cwd server --frozen-lockfile
          bun install --cwd web --frozen-lockfile
      - name: Typecheck web
        run: bun run --cwd web typecheck
      - name: Build web
        run: bun run --cwd web build

  docker:
    name: Build and push images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push API image
        run: |
          docker build \
            --platform linux/amd64 \
            -f ./server/Dockerfile \
            -t ${{ secrets.DOCKER_USERNAME }}/quiz-words-api:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/quiz-words-api:${{ github.sha }} \
            ./server
          docker push ${{ secrets.DOCKER_USERNAME }}/quiz-words-api:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/quiz-words-api:${{ github.sha }}

      - name: Build and push web image
        run: |
          docker build \
            --platform linux/amd64 \
            -f ./web/Dockerfile \
            -t ${{ secrets.DOCKER_USERNAME }}/quiz-words-web:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/quiz-words-web:${{ github.sha }} \
            ./web
          docker push ${{ secrets.DOCKER_USERNAME }}/quiz-words-web:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/quiz-words-web:${{ github.sha }}
