name: CI

on:
  workflow_dispatch:
    inputs:
      push_images:
        description: Push Docker images to the registry
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install
        run: |
          bun install --cwd server --frozen-lockfile
          bun install --cwd web --frozen-lockfile
      - name: Typecheck web
        run: bun run --cwd web typecheck
      - name: Build web
        run: bun run --cwd web build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    env:
      REGISTRY: ${{ vars.REGISTRY || 'docker.io' }}
      USERNAME: ${{ secrets.USERNAME || vars.USERNAME }}
      PUSH_IMAGES: ${{ github.event.inputs.push_images == 'true' && (secrets.USERNAME != '' || vars.USERNAME != '') && secrets.PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.USERNAME }}
          password: ${{ secrets.PASSWORD }}

      - name: API image tags
        id: api-tags
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.USERNAME || 'local' }}/quiz-words-api
          tags: |
            type=raw,value=latest,enable=${{ github.event.inputs.push_images == 'true' }}
            type=sha,prefix=
            type=ref,event=branch

      - name: Web image tags
        id: web-tags
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.USERNAME || 'local' }}/quiz-words-web
          tags: |
            type=raw,value=latest,enable=${{ github.event.inputs.push_images == 'true' }}
            type=sha,prefix=
            type=ref,event=branch

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: ${{ env.PUSH_IMAGES == 'true' }}
          tags: ${{ steps.api-tags.outputs.tags }}
          labels: ${{ steps.api-tags.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: ${{ env.PUSH_IMAGES == 'true' }}
          tags: ${{ steps.web-tags.outputs.tags }}
          labels: ${{ steps.web-tags.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
