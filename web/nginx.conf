server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 10m;

  location = /config.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  location /api/ {
    include /etc/nginx/api-proxy.conf;
  }

  location /quiz/api/ {
    rewrite ^/quiz(/api/.*)$ $1 break;
    include /etc/nginx/api-proxy.conf;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
