server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 10m;

  location = /config.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  # If a reverse proxy sends API traffic to the UI host, answer CORS
  # preflight instead of a headerless 405/404.
  location ^~ /quiz/api/ {
    include /etc/nginx/cors-preflight.conf;
  }

  location ^~ /api/ {
    include /etc/nginx/cors-preflight.conf;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
