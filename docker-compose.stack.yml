# Portainer / production: pull images only (no build context).
# Stack env:
#   DOCKER_USERNAME, OPENROUTER_API_KEY
#   API_URL — public origin the browser should call, e.g. https://app.example.com
#   Leave API_URL empty to use same-origin /api on the web host.

services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    networks:
      - quiz
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped

  api:
    image: ${DOCKER_USERNAME}/quiz-words-api:${IMAGE_TAG:-latest}
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      WEB_ORIGIN: ${WEB_ORIGIN:-*}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: quiz
    ports:
      - "3000:3000"
    depends_on:
      - mongo
    networks:
      - quiz
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 20s
    restart: unless-stopped

  web:
    image: ${DOCKER_USERNAME}/quiz-words-web:${IMAGE_TAG:-latest}
    ports:
      - "8080:80"
    environment:
      API_URL: ${API_URL:-}
    depends_on:
      - api
    networks:
      - quiz
    restart: unless-stopped

networks:
  quiz:

volumes:
  mongo-data:
