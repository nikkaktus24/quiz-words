# Portainer / production: pull images only (no build context).
# Set DOCKER_USERNAME (and OPENROUTER_API_KEY) in the stack env.

services:
  libsql:
    image: ghcr.io/tursodatabase/libsql-server:latest
    environment:
      SQLD_NODE: primary
      SQLD_HTTP_LISTEN_ADDR: "0.0.0.0:8080"
    volumes:
      - libsql-data:/var/lib/sqld
    networks:
      - quiz
    restart: unless-stopped

  api:
    image: ${DOCKER_USERNAME}/quiz-words-api:${IMAGE_TAG:-latest}
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      WEB_ORIGIN: ${WEB_ORIGIN:-*}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      LIBSQL_URL: http://libsql:8080
    depends_on:
      - libsql
    networks:
      - quiz
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 10s
    restart: unless-stopped

  web:
    image: ${DOCKER_USERNAME}/quiz-words-web:${IMAGE_TAG:-latest}
    ports:
      - "8080:80"
    environment:
      API_URL: ${API_URL:-}
    depends_on:
      - api
    networks:
      - quiz
    restart: unless-stopped

networks:
  quiz:

volumes:
  libsql-data:
